default_stages:
  - commit
# icassp/spconf.sty and icassp/IEEEbib.bst are VENDOR files shipped with the
# ICASSP author kit. They must stay byte-identical to what the conference
# distributes, so the whitespace/EOF fixers must not rewrite them.
exclude: node_modules|.git/|.tox|^icassp/(spconf\.sty|IEEEbib\.bst)$
fail_fast: true
repos:
  - hooks:
      - id:
          actionlint
    repo: https://github.com/rhysd/actionlint
    rev: v1.6.25

  - hooks:
      - id: detect-secrets
        args: [ '--baseline', '.secrets.baseline' ]
        exclude: (config/settings/test.py|/static|.html|local|README.md|poetry.lock|infra/environments/.*_cf_parameters.json*)
    repo: https://github.com/Yelp/detect-secrets.git
    rev: v1.4.0

  - hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements
      - id: check-added-large-files
      - id: check-docstring-first
      - id: check-case-conflict
      - id: check-builtin-literals
      - id: mixed-line-ending
      - id: check-json
        files: \.(json)$
      - id: check-toml
        files: \.(toml)$
      - id: check-yaml
        files: \.(yaml)$
      - id: fix-encoding-pragma
        args: [ --remove ]
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0

  - hooks:
      - id: isort
        entry: isort
        additional_dependencies: [ "toml" ]
    repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1

  - hooks:
      - exclude: (/settings/)
        id: black
        require_serial: true
        types:
          - python
    repo: https://github.com/ambv/black
    rev: 23.7.0

  - hooks:
      - id: flakeheaven
    repo: https://github.com/flakeheaven/flakeheaven
    rev: 3.3.0

  - hooks:
      - entry: pylint --jobs=0
        exclude: (/settings/)
        files: \.py$
        id: PyLint
        language: system
        name: PyLint
    repo: local

  - hooks:
      - id: ruff
    repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.277

  - hooks:
      - id: commitizen
        stages:
          - commit-msg
    repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0

  - hooks:
      - id: bandit
        args: [ -c, pyproject.toml, --verbose, -ll, --recursive, . ]
        additional_dependencies: [ "bandit[toml]" ]
    repo: https://github.com/PyCQA/bandit
    rev: 1.7.5

  - hooks:
      - entry: mypy
        args: [ "." ]
        id: mypy
        language: system
        name: mypy
        pass_filenames: false
    repo: local

  - repo: https://github.com/Trim21/poetry-check-lock.git
    rev: v0.0.5
    hooks:
      - id: poetry-check-lock
